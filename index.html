<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FixerBud Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #f0f4f8;
  color: #334155;
  min-height: 100vh;
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #f0f4f8; }
::-webkit-scrollbar-thumb { background: #f97316; border-radius: 3px; }

/* ── Login ── */
.login-page {
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh;
  background: linear-gradient(135deg, #0a1929 0%, #1a2940 40%, #f97316 100%);
  position: relative; overflow: hidden;
}
.login-page::before {
  content: ''; position: absolute; width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(249,115,22,.15) 0%, transparent 70%);
  top: -200px; right: -200px; border-radius: 50%;
}
.login-page::after {
  content: ''; position: absolute; width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(249,115,22,.1) 0%, transparent 70%);
  bottom: -100px; left: -100px; border-radius: 50%;
}
.login-card {
  background: rgba(255,255,255,.97);
  border-radius: 20px; padding: 44px 40px; width: 400px; max-width: 90vw;
  box-shadow: 0 25px 80px rgba(0,0,0,.3);
  position: relative;
}
.login-card .logo { text-align: center; margin-bottom: 12px; }
.login-card .logo img { border: 3px solid #f97316; }
.login-card h1 { font-size: 26px; margin-bottom: 2px; color: #0a1929; text-align: center; }
.login-card p { color: #64748b; font-size: 14px; margin-bottom: 28px; text-align: center; }
.login-card input {
  width: 100%; padding: 14px 16px;
  border: 2px solid #e2e8f0; border-radius: 12px;
  font-size: 15px; margin-bottom: 14px; outline: none;
  transition: border-color .2s, box-shadow .2s;
  background: #fff; color: #0a1929;
}
.login-card input:focus { border-color: #f97316; box-shadow: 0 0 0 4px rgba(249,115,22,.12); }
.login-card input::placeholder { color: #94a3b8; }
.login-card button {
  width: 100%; padding: 14px;
  background: linear-gradient(135deg, #f97316, #ea580c);
  color: #fff; border: none; border-radius: 12px;
  font-size: 16px; font-weight: 700; cursor: pointer;
  transition: transform .15s, box-shadow .2s;
  box-shadow: 0 4px 16px rgba(249,115,22,.3);
}
.login-card button:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(249,115,22,.4); }
.login-card button:disabled { opacity: .6; cursor: not-allowed; transform: none; }
.login-card .error { color: #dc2626; font-size: 13px; margin-bottom: 12px; text-align: center; background: #fef2f2; padding: 10px; border-radius: 8px; }

/* ── App layout ── */
.app { display: flex; min-height: 100vh; }
.sidebar {
  width: 260px; background: linear-gradient(180deg, #0a1929 0%, #0f2341 100%);
  color: #fff; display: flex; flex-direction: column; flex-shrink: 0;
  box-shadow: 2px 0 20px rgba(0,0,0,.08);
  position: sticky; top: 0; height: 100vh;
}
.sidebar .brand {
  padding: 24px 20px;
  border-bottom: 1px solid rgba(249,115,22,.12);
  display: flex; align-items: center; gap: 12px;
}
.sidebar .brand .brand-icon {
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(135deg, #f97316, #ea580c);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.sidebar .brand h2 { font-size: 17px; color: #fff; line-height: 1.2; }
.sidebar .brand small { color: #f97316; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
.sidebar nav { flex: 1; padding: 16px 10px; overflow-y: auto; }
.sidebar nav a {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 14px; margin-bottom: 2px;
  color: #94a3b8; text-decoration: none; font-size: 14px; font-weight: 500;
  transition: all .15s; cursor: pointer; border: none; background: none;
  width: 100%; text-align: left;
  border-radius: 10px;
}
.sidebar nav a:hover { color: #fff; background: rgba(249,115,22,.1); }
.sidebar nav a.active {
  color: #fff; background: rgba(249,115,22,.15);
  font-weight: 600;
  box-shadow: inset 3px 0 0 #f97316;
}
.sidebar .sidebar-footer { padding: 16px 20px; border-top: 1px solid rgba(249,115,22,.1); }
.sidebar .sidebar-footer button {
  background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08);
  color: #94a3b8; cursor: pointer; font-size: 13px; padding: 10px 14px;
  display: flex; align-items: center; gap: 8px; width: 100%;
  border-radius: 10px; transition: all .15s;
}
.sidebar .sidebar-footer button:hover { background: rgba(249,115,22,.1); color: #f97316; border-color: rgba(249,115,22,.2); }

.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar {
  background: rgba(255,255,255,.85); backdrop-filter: blur(12px);
  padding: 16px 28px; border-bottom: 1px solid #e2e8f0;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 50;
}
.topbar h1 { font-size: 20px; font-weight: 800; color: #0a1929; letter-spacing: -.3px; }
.topbar .user-info { font-size: 13px; color: #64748b; background: #f1f5f9; padding: 6px 14px; border-radius: 20px; }
.content { flex: 1; padding: 28px; overflow-y: auto; }

/* ── Stats Grid ── */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 28px; }
.stat-card {
  background: #fff; border-radius: 16px; padding: 24px;
  box-shadow: 0 1px 3px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  transition: transform .2s, box-shadow .2s;
  position: relative; overflow: hidden;
  border: 1px solid rgba(0,0,0,.04);
}
.stat-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0;
  height: 4px; border-radius: 16px 16px 0 0;
}
.stat-card:hover { transform: translateY(-4px); box-shadow: 0 8px 32px rgba(0,0,0,.08); }
.stat-card .stat-icon { font-size: 24px; margin-bottom: 12px; }
.stat-card .stat-value { font-size: 30px; font-weight: 800; letter-spacing: -.5px; }
.stat-card .stat-label { font-size: 14px; color: #64748b; margin-top: 6px; font-weight: 600; letter-spacing: .3px; }
.stat-card:nth-child(1)::before { background: #3b82f6; }
.stat-card:nth-child(2)::before { background: #22c55e; }
.stat-card:nth-child(3)::before { background: #14b8a6; }
.stat-card:nth-child(4)::before { background: #f97316; }
.stat-card:nth-child(5)::before { background: #3b82f6; }
.stat-card:nth-child(6)::before { background: #22c55e; }
.stat-card:nth-child(7)::before { background: #a855f7; }
.stat-card:nth-child(8)::before { background: #f97316; }

/* ── Content Cards ── */
.card {
  background: #fff; border-radius: 16px; padding: 24px;
  box-shadow: 0 1px 3px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  border: 1px solid rgba(0,0,0,.04);
  margin-bottom: 24px;
}
.card h2 {
  font-size: 16px; font-weight: 700; color: #0a1929; margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px;
}
.card h2::after {
  content: ''; flex: 1; height: 1px; background: linear-gradient(to right, #e2e8f0, transparent);
}

/* ── Tables ── */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid #f1f5f9; }
th {
  font-weight: 700; color: #64748b; font-size: 11px;
  text-transform: uppercase; letter-spacing: .6px;
  background: #f8fafc; white-space: nowrap;
}
th:first-child { border-radius: 8px 0 0 8px; }
th:last-child { border-radius: 0 8px 8px 0; }
td { color: #334155; vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #f8fafc; }

/* ── Badges ── */
.badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: capitalize; letter-spacing: .2px; }
.badge-green { background: #dcfce7; color: #166534; }
.badge-blue { background: #dbeafe; color: #1e40af; }
.badge-orange { background: #ffedd5; color: #9a3412; }
.badge-red { background: #fef2f2; color: #991b1b; }
.badge-gray { background: #f1f5f9; color: #475569; }
.badge-purple { background: #f3e8ff; color: #6b21a8; }
.badge-teal { background: #ccfbf1; color: #115e59; }

/* ── Buttons ── */
.btn {
  padding: 9px 18px; border: none; border-radius: 10px;
  font-size: 13px; font-weight: 600; cursor: pointer;
  transition: all .15s; display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { transform: translateY(-1px); }
.btn-sm { padding: 5px 12px; font-size: 11px; border-radius: 8px; }
.btn-success { background: #dcfce7; color: #166534; }
.btn-success:hover { background: #bbf7d0; }
.btn-danger { background: #fef2f2; color: #991b1b; }
.btn-danger:hover { background: #fecaca; }
.btn-primary {
  background: linear-gradient(135deg, #f97316, #ea580c);
  color: #fff; padding: 11px 22px;
  box-shadow: 0 4px 14px rgba(249,115,22,.25);
}
.btn-primary:hover { box-shadow: 0 6px 20px rgba(249,115,22,.35); }
.btn-secondary { background: #f1f5f9; color: #475569; }
.btn-secondary:hover { background: #e2e8f0; }

/* ── Verification progress ── */
.progress-group { display: grid; gap: 12px; margin-top: 8px; }
.progress-item { display: flex; align-items: center; gap: 16px; }
.progress-item .label { width: 100px; font-size: 14px; font-weight: 500; color: #475569; }
.progress-item .bar { flex: 1; height: 20px; background: #f1f5f9; border-radius: 10px; overflow: hidden; position: relative; }
.progress-item .bar-fill { height: 100%; border-radius: 10px; transition: width .5s ease; position: relative; }
.progress-item .bar-fill::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.15), transparent);
  animation: shimmer 2s infinite;
}
@keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
.progress-item .count { width: 36px; text-align: right; font-weight: 700; font-size: 15px; }

/* ── Form ── */
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 6px; }
.form-group input, .form-group textarea, .form-group select {
  width: 100%; padding: 11px 14px;
  border: 2px solid #e2e8f0; border-radius: 10px;
  font-size: 14px; outline: none; transition: border-color .2s, box-shadow .2s;
  background: #fff; color: #0a1929; font-family: inherit;
}
.form-group input:focus, .form-group textarea:focus, .form-group select:focus {
  border-color: #f97316; box-shadow: 0 0 0 4px rgba(249,115,22,.1);
}
.form-group input::placeholder, .form-group textarea::placeholder { color: #94a3b8; }
.form-group textarea { resize: vertical; min-height: 80px; }
.form-row { display: flex; gap: 16px; }
.form-row .form-group { flex: 1; }

/* ── Loading ── */
.loading { display: flex; align-items: center; justify-content: center; padding: 80px; }
.spinner { width: 36px; height: 36px; border: 3px solid #e2e8f0; border-top-color: #f97316; border-radius: 50%; animation: spin .6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty { text-align: center; padding: 60px 40px; color: #94a3b8; font-size: 14px; background: #fff; border-radius: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }

/* ── Modal ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(15,23,42,.5);
  backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center; z-index: 100;
  animation: fadeIn .2s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: #fff; border-radius: 20px; padding: 36px;
  width: 540px; max-width: 90vw; max-height: 85vh; overflow-y: auto;
  box-shadow: 0 25px 80px rgba(0,0,0,.2);
  animation: slideUp .25s ease;
}
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal h2 { font-size: 20px; font-weight: 700; color: #0a1929; margin-bottom: 20px; }
.modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; }

/* ── Toast ── */
.toast {
  position: fixed; bottom: 24px; right: 24px;
  background: linear-gradient(135deg, #f97316, #ea580c);
  color: #fff; padding: 14px 28px; border-radius: 12px;
  font-size: 14px; font-weight: 600;
  box-shadow: 0 8px 32px rgba(249,115,22,.3);
  z-index: 200;
  animation: toastIn .3s ease;
}
@keyframes toastIn {
  from { transform: translateY(20px) scale(.95); opacity: 0; }
  to { transform: translateY(0) scale(1); opacity: 1; }
}

/* ── Row actions ── */
.row-actions { display: flex; gap: 6px; align-items: center; }

/* ── Category add area ── */
.add-category { background: #f8fafc; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 2px dashed #e2e8f0; transition: border-color .2s; }
.add-category:focus-within { border-color: #f97316; }
.add-category h2 { color: #0a1929; font-size: 15px; margin-bottom: 16px; }

/* ── Toolbar / search ── */
.toolbar { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.toolbar input, .toolbar select {
  padding: 10px 14px; border: 2px solid #e2e8f0; border-radius: 10px;
  font-size: 13px; font-family: inherit; background: #fff; color: #0a1929;
}
.toolbar input:focus, .toolbar select:focus { outline: none; border-color: #f97316; }
.toolbar input { flex: 1; min-width: 220px; }
.toolbar .count-note { font-size: 12px; color: #94a3b8; font-weight: 600; }

/* ── Media gallery ── */
.media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
.media-item {
  background: #fff; border-radius: 12px; overflow: hidden; cursor: pointer;
  box-shadow: 0 1px 3px rgba(0,0,0,.06); transition: transform .15s, box-shadow .15s;
  border: 2px solid transparent;
}
.media-item:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.1); border-color: #f97316; }
.media-item .thumb {
  height: 130px; background: #f1f5f9 center/cover no-repeat;
  display: flex; align-items: center; justify-content: center; color: #cbd5e1; font-size: 28px;
}
.media-item .cap { padding: 10px 12px; }
.media-item .cap .t { font-size: 12px; font-weight: 700; color: #0a1929; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.media-item .cap .s { font-size: 11px; color: #94a3b8; margin-top: 3px; }
.media-section { margin-bottom: 28px; }
.media-section > h2 { margin-bottom: 14px; }

/* ── Chat transcript ── */
.chat-thread { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.05); margin-bottom: 16px; }
.chat-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid #e2e8f0; flex-wrap: wrap; }
.chat-head .who { font-size: 14px; font-weight: 700; color: #0a1929; }
.chat-head .sub { font-size: 12px; color: #94a3b8; margin-top: 2px; }
.chat-msg { display: flex; margin-bottom: 10px; }
.chat-msg.mine { justify-content: flex-end; }
.chat-bubble {
  max-width: 78%; padding: 10px 14px; border-radius: 14px;
  background: #f1f5f9; color: #0f172a; font-size: 13px; line-height: 1.5; word-break: break-word;
}
.chat-msg.mine .chat-bubble { background: #0a1929; color: #fff; border-bottom-right-radius: 4px; }
.chat-msg:not(.mine) .chat-bubble { border-bottom-left-radius: 4px; }
.chat-meta { font-size: 10px; color: #94a3b8; margin-top: 4px; display: flex; gap: 8px; align-items: center; }
.chat-msg.mine .chat-meta { justify-content: flex-end; }

/* ── Key/value detail grid ── */
.kv { display: grid; grid-template-columns: 150px 1fr; gap: 8px 16px; font-size: 13px; }
.kv dt { color: #94a3b8; font-weight: 600; }
.kv dd { margin: 0; color: #0f172a; font-weight: 500; word-break: break-word; }
.modal.wide { max-width: 860px; width: 94vw; }
.modal-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; border-bottom: 2px solid #e2e8f0; padding-bottom: 0; }
.modal-tabs button {
  padding: 9px 14px; border: none; background: none; font-family: inherit; font-size: 13px;
  font-weight: 600; color: #64748b; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px;
}
.modal-tabs button.active { color: #f97316; border-bottom-color: #f97316; }
.pane { max-height: 55vh; overflow-y: auto; padding-right: 4px; }
.sub-head { font-size: 12px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: .5px; margin: 18px 0 10px; }
.sub-head:first-child { margin-top: 0; }

/* ── Lightbox ── */
.lightbox {
  position: fixed; inset: 0; background: rgba(10,25,41,.92); z-index: 3000;
  display: flex; align-items: center; justify-content: center; padding: 32px; cursor: zoom-out;
}
.lightbox img { max-width: 100%; max-height: 90vh; border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.lightbox .lb-cap { position: absolute; bottom: 16px; left: 0; right: 0; text-align: center; color: #fff; font-size: 13px; }
.thumbs { display: flex; gap: 6px; flex-wrap: wrap; }
.thumbs img { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; cursor: pointer; border: 2px solid #e2e8f0; }
.thumbs img:hover { border-color: #f97316; }
.stars { color: #f59e0b; letter-spacing: 1px; }

/* ── Invoice document ── */
.doc {
  background: #fff; border: 1px solid #e2e8f0; border-radius: 12px;
  padding: 32px; color: #0f172a; max-width: 720px; margin: 0 auto;
}
.doc-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; padding-bottom: 20px; border-bottom: 2px solid #0a1929; flex-wrap: wrap; }
.doc-head .brand-name { font-size: 24px; font-weight: 800; color: #0a1929; letter-spacing: -.5px; }
.doc-head .doc-title { font-size: 15px; font-weight: 800; color: #f97316; letter-spacing: 3px; }
.doc-parties { display: flex; gap: 32px; flex-wrap: wrap; margin: 22px 0; }
.doc-parties > div { flex: 1; min-width: 190px; }
.doc-parties h4 { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; margin-bottom: 7px; }
.doc-parties .nm { font-weight: 700; font-size: 14px; margin-bottom: 3px; }
.doc-parties .ln { font-size: 12px; color: #64748b; line-height: 1.6; }
.doc table { width: 100%; border-collapse: collapse; margin-top: 8px; }
.doc table th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .6px; color: #94a3b8; padding: 9px 8px; border-bottom: 2px solid #e2e8f0; }
.doc table td { padding: 11px 8px; font-size: 13px; border-bottom: 1px solid #f1f5f9; vertical-align: top; }
.doc table td.num, .doc table th.num { text-align: right; white-space: nowrap; }
.doc-totals { margin-top: 20px; margin-left: auto; max-width: 280px; }
.doc-totals .row { display: flex; justify-content: space-between; padding: 7px 0; font-size: 13px; color: #64748b; }
.doc-totals .row.grand { border-top: 2px solid #0a1929; margin-top: 6px; padding-top: 12px; font-size: 17px; font-weight: 800; color: #0a1929; }
.doc-stamp { display: inline-block; margin-top: 18px; padding: 7px 18px; border: 3px solid #16a34a; border-radius: 8px; color: #16a34a; font-weight: 800; font-size: 14px; letter-spacing: 2px; transform: rotate(-4deg); }
.doc-stamp.unpaid { border-color: #ea580c; color: #ea580c; }
.doc-note { margin-top: 20px; padding: 13px 16px; background: #f8fafc; border-radius: 8px; font-size: 12px; color: #475569; line-height: 1.6; }
.doc-serial { font-size: 11px; color: #64748b; margin-top: 4px; }

/* Print: strip the app chrome so the browser's Save-as-PDF yields a clean invoice. */
@media print {
  .sidebar, .topbar, .modal-actions, .toast, .lightbox { display: none !important; }
  body, .content, .main, .app { background: #fff !important; padding: 0 !important; overflow: visible !important; }
  .modal-overlay { position: static !important; background: #fff !important; padding: 0 !important; }
  .modal { max-width: 100% !important; max-height: none !important; overflow: visible !important; box-shadow: none !important; }
  .doc { border: none; padding: 0; }
  /* Quote and job modals print as documents too. */
  #job-modal .modal-tabs, #job-modal .pane { display: none !important; }

// Explains WHY a page is empty: no data at all, rows hidden by RLS,
// or a migration that was never applied.
async function runDiagnostics(el) {
  const card = document.getElementById('diag-card');
  const body = document.getElementById('diag-body');
  if (!card) return;
  card.style.display = '';

  const watched = ['messages', 'calls', 'notifications', 'invoices', 'quotes', 'jobs'];
  const trueCounts = await fetchTrueCounts();

  if (!trueCounts) {
    body.innerHTML = `<div style="font-size:13px;color:#475569;line-height:1.7">
      <strong style="color:#dc2626">Diagnostic unavailable.</strong> The
      <code>admin_row_counts()</code> function is not installed, so
      <code>supabase/migrations/038_admin_row_counts.sql</code> has not been run yet.<br><br>
      Until it is, this panel cannot tell apart "no data yet" from "permissions are hiding data".
    </div>`;
    return;
  }

  // What the browser can actually see right now, per table.
  const [m, c, n, inv, q, j] = await Promise.all([
    _supabase.from('messages').select('id'),
    _supabase.from('calls').select('id'),
    _supabase.from('notifications').select('id'),
    _supabase.from('invoices').select('id'),
    _supabase.from('quotes').select('id'),
    _supabase.from('jobs').select('id'),
  ]);
  const visible = {
    messages: (m.data || []).length, calls: (c.data || []).length,
    notifications: (n.data || []).length, invoices: (inv.data || []).length,
    quotes: (q.data || []).length, jobs: (j.data || []).length,
  };

  const rows = watched.map(t => {
    const truth = trueCounts[t] || 0;
    const seen = visible[t];
    let verdict, color;
    if (truth === 0) { verdict = 'no data yet'; color = '#94a3b8'; }
    else if (seen < truth) { verdict = `${seen} of ${truth} visible — RLS is hiding ${truth - seen}`; color = '#dc2626'; }
    else { verdict = `${truth} row${truth === 1 ? '' : 's'}`; color = '#2e7d32'; }
    return `<tr>
      <td><strong>${t}</strong></td>
      <td>${truth}</td>
      <td>${seen}</td>
      <td><span class="badge" style="background:${color}22;color:${color}">${verdict}</span></td>
    </tr>`;
  }).join('');

  const hidden = watched.some(t => {
    const truth = trueCounts[t] || 0;
    return truth > 0 && visible[t] < truth;
  });

  body.innerHTML = `
    <p style="font-size:12px;color:#64748b;margin-bottom:12px">
      "In database" is the true row count (bypasses RLS). "Visible" is what this
      browser can actually read right now. A gap means a row-level security policy is blocking it.
    </p>
    <div class="table-wrap"><table>
      <thead><tr><th>Table</th><th>In database</th><th>Visible</th><th>Status</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    ${hidden ? `<div style="margin-top:14px;padding:12px 14px;background:#fef2f2;border-radius:8px;font-size:12px;color:#991b1b">
      <strong>Rows are being hidden.</strong> Re-run <code>037_admin_read_all.sql</code> in the
      Supabase SQL editor, then sign out and back in so the new policy applies to your session.
    </div>` : ''}
    <div style="margin-top:12px;font-size:11px;color:#94a3b8">Page build: <code>${BUILD}</code> — if this looks out of date, hard-reload with Ctrl+Shift+R.</div>`;
}

    <div class="modal">
      <h2>Edit Business</h2>
      <div style="display:flex;gap:16px;margin-bottom:16px;align-items:center">
        <div id="logo-preview" style="width:80px;height:80px;border-radius:12px;border:2px dashed #ddd;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#f9f9f9;flex-shrink:0">
          ${data.logo_preview ? `<img src="${esc(data.logo_preview)}" style="width:100%;height:100%;object-fit:cover">` : '<span style="color:#ccc;font-size:11px">No logo</span>'}
        </div>
        <div style="flex:1">
          <label style="display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:4px">Upload New Logo</label>
          <input type="file" id="logo-file" accept="image/*" style="font-size:13px">
        </div>
      </div>
      <div class="form-group"><label>Logo URL (or paste a URL)</label><input id="biz-logo-url" value="${esc(data.logo_url || '')}" placeholder="https://..."></div>
      <div class="form-row">
        <div class="form-group"><label>Business Name</label><input id="biz-name" value="${esc(data.business_name || '')}"></div>
        <div class="form-group"><label>Phone</label><input id="biz-phone" value="${esc(data.business_phone || '')}"></div>
      </div>
      <div class="form-group"><label>Suburb</label><input id="biz-suburb" value="${esc(data.suburb || '')}"></div>
      <div class="form-group"><label>Description</label><textarea id="biz-desc" rows="2">${esc(data.description || '')}</textarea></div>
      <div class="modal-actions">
        <button class="btn" style="background:#e0e0e0;color:#333" onclick="closeBizModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveBiz()">Save Changes</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  // Preview uploaded logo
  document.getElementById('logo-file').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      document.getElementById('logo-preview').innerHTML = `<img src="${ev.target.result}" style="width:100%;height:100%;object-fit:cover">`;
      _editingBiz._logoFile = file;
    };
    reader.readAsDataURL(file);
  });

  // Update preview when URL changes
  document.getElementById('biz-logo-url').addEventListener('input', (e) => {
    if (e.target.value && !_editingBiz._logoFile) {
      document.getElementById('logo-preview').innerHTML = `<img src="${esc(e.target.value)}" style="width:100%;height:100%;object-fit:cover" onerror="this.parentElement.innerHTML='<span style=color:#ccc;font-size:11px>Invalid URL</span>'">`;
    }
  });
}

function closeBizModal() {
  const m = document.getElementById('biz-modal');
  if (m) m.remove();
  _editingBiz = null;
}

async function saveBiz() {
  if (!_editingBiz) return;
  const btn = document.querySelector('#biz-modal .btn-primary');
  btn.disabled = true; btn.textContent = 'Saving...';

  try {
    const id = _editingBiz.id;
    const name = document.getElementById('biz-name').value.trim();
    const phone = document.getElementById('biz-phone').value.trim();
    const suburb = document.getElementById('biz-suburb').value.trim();
    const desc = document.getElementById('biz-desc').value.trim();
    let logoUrl = document.getElementById('biz-logo-url').value.trim();

    // If a new file was selected, upload it
    if (_editingBiz._logoFile) {
      const ext = _editingBiz._logoFile.name.split('.').pop();
      const path = `${id}/${Date.now()}.${ext}`;
      const { error: uploadErr } = await _supabase.storage.from('business-media').upload(path, _editingBiz._logoFile);
      if (uploadErr) { toast('Upload failed: ' + uploadErr.message); btn.disabled = false; btn.textContent = 'Save Changes'; return; }
      logoUrl = publicUrl(path);
    }

    const updates = { business_name: name, business_phone: phone, suburb, description: desc, logo_url: logoUrl || null };
    await _supabase.from('business_profiles').update(updates).eq('id', id);
    toast('Business updated');
    closeBizModal();
    loadPage('businesses');
  } catch (e) {
    toast('Error: ' + e.message);
    btn.disabled = false;
    btn.textContent = 'Save Changes';
  }
}

window.downloadQuotePDF = async function() {
  if (!_quote) return;
  if (typeof window.jspdf === 'undefined') {
    toast('PDF library failed to load — use Print instead');
    return;
  }
  const btn = document.querySelector('#quote-modal .btn-primary');
  if (btn) { btn.disabled = true; btn.textContent = 'Building PDF...'; }

  const { q, biz, jobRef, logo, items, images, customerName, techName } = _quote;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const W = doc.internal.pageSize.getWidth();
  const M = 40;
  const money = n => 'R' + Number(n || 0).toFixed(2);
  let y = M;

  if (logo) {
    try {
      const img = await loadImageAsDataUrl(logo);
      if (img) doc.addImage(img, 'PNG', W - M - 46, y, 46, 46);
    } catch (_) { /* optional */ }
  }

  doc.setFont('helvetica', 'bold').setFontSize(21).setTextColor(10, 25, 41);
  doc.text('FixerBud', M, y + 15);
  doc.setFont('helvetica', 'normal').setFontSize(8).setTextColor(148, 163, 184);
  doc.text('Maintenance & Repairs', M, y + 28);
  doc.setFont('helvetica', 'bold').setFontSize(13).setTextColor(249, 115, 22);
  doc.text('QUOTE', W - M, y + 15, { align: 'right' });
  doc.setFontSize(10).setTextColor(15, 23, 42);
  doc.text(q.quote_number || '-', W - M, y + 32, { align: 'right' });
  doc.setFont('helvetica', 'normal').setFontSize(8).setTextColor(148, 163, 184);
  doc.text('Issued ' + fmtDate(q.created_at), W - M, y + 44, { align: 'right' });
  if (q.valid_until) doc.text('Valid until ' + fmtDate(q.valid_until), W - M, y + 55, { align: 'right' });

  y += 74;
  doc.setDrawColor(10, 25, 41).setLineWidth(1.5).line(M, y, W - M, y);
  y += 22;

  const colW = (W - M * 2) / 2;
  doc.setFont('helvetica', 'bold').setFontSize(7).setTextColor(148, 163, 184);
  doc.text('FROM', M, y);
  doc.text('PREPARED FOR', M + colW, y);
  y += 12;
  doc.setFontSize(10).setTextColor(15, 23, 42);
  doc.text(trunc(doc, biz?.business_name || 'FixerBud', colW - 20), M, y + 4);
  doc.text(trunc(doc, customerName || 'Customer', colW - 20), M + colW, y + 4);
  y += 15;
  doc.setFont('helvetica', 'normal').setFontSize(8).setTextColor(100, 116, 139);
  [biz?.business_phone ? 'Tel: ' + biz.business_phone : '', biz?.suburb || '', biz?.description || '']
    .filter(Boolean).forEach(l => { doc.text(trunc(doc, l, colW - 20), M, y); y += 11; });
  y += 4;
  if (techName) { doc.setTextColor(15, 23, 42).text('Quoted by: ' + trunc(doc, techName, colW - 60), M + colW, y); y += 11; }
  if (jobRef) doc.text('Job: ' + trunc(doc, jobRef, colW - 40), M + colW, y);

  y += 12;
  // Title + scope of work
  if (y > 700) { doc.addPage(); y = M; }
  doc.setFont('helvetica', 'bold').setFontSize(10).setTextColor(10, 25, 41);
  doc.text(doc.splitTextToSize(q.title || 'Quote', W - M * 2), M, y);
  y += 13;
  if (q.description) {
    doc.setFont('helvetica', 'normal').setFontSize(8).setTextColor(100, 116, 139);
    const lines = doc.splitTextToSize(q.description, W - M * 2);
    doc.text(lines, M, y);
    y += lines.length * 10 + 6;
  }

  // Table
  if (y > 700) { doc.addPage(); y = M; }
  const cols = { desc: M, qty: W - M - 190, unit: W - M - 100, total: W - M };
  doc.setFillColor(248, 250, 252);
  doc.rect(M, y - 12, W - M * 2, 22, 'F');
  doc.setFont('helvetica', 'bold').setFontSize(7).setTextColor(100, 116, 139);
  doc.text('DESCRIPTION', cols.desc + 6, y + 2);
  doc.text('QTY', cols.qty, y + 2, { align: 'right' });
  doc.text('UNIT', cols.unit, y + 2, { align: 'right' });
  doc.text('TOTAL', cols.total - 6, y + 2, { align: 'right' });
  y += 18;
  doc.setFont('helvetica', 'normal').setFontSize(9).setTextColor(15, 23, 42);
  items.forEach(m => {
    if (y > 700) { doc.addPage(); y = M + 10; }
    const lines = doc.splitTextToSize(m.description || '', cols.qty - cols.desc - 30);
    doc.text(lines, cols.desc + 6, y);
    doc.text(String(m.quantity ?? 1), cols.qty, y, { align: 'right' });
    doc.setTextColor(100, 116, 139);
    doc.text(money(m.unit_price), cols.unit, y, { align: 'right' });
    doc.setFont('helvetica', 'bold').setTextColor(15, 23, 42);
    doc.text(money(m.total), cols.total - 6, y, { align: 'right' });
    doc.setFont('helvetica', 'normal');
    y += (lines.length > 1 ? (lines.length - 1) * 11 : 0) + 16;
    doc.setDrawColor(241, 245, 249).setLineWidth(0.5).line(M, y - 11, W - M, y - 11);
  });
  if (!items.length) {
    doc.setTextColor(148, 163, 184).setFontSize(9).text('No line items', M + 6, y);
    y += 20;
  }

  y += 8;
  if (y > 700) { doc.addPage(); y = M; }
  const tX = W - M - 190, tW = 190;
  const tRow = (label, val, bold, rule) => {
    doc.setFont('helvetica', bold ? 'bold' : 'normal').setFontSize(bold ? 12 : 9);
    doc.setTextColor(...(bold ? [10, 25, 41] : [100, 116, 139]));
    doc.text(label, tX, y);
    doc.setFont('helvetica', 'bold').setTextColor(15, 23, 42);
    doc.text(val, tX + tW, y, { align: 'right' });
    y += bold ? 16 : 14;
    if (rule) { doc.setDrawColor(10, 25, 41).setLineWidth(1).line(tX, y - 11, tX + tW, y - 11); y += 4; }
  };
  tRow('Subtotal', money(q.subtotal));
  tRow('VAT (' + ((q.tax_rate || 0) * 100).toFixed(0) + '%)', money(q.tax_amount));
  tRow('Total', money(q.total), true, true);

  doc.setTextColor(...(q.status === 'accepted' ? [22, 163, 74] : [234, 88, 12]));
  doc.setFont('helvetica', 'bold').setFontSize(13);
  doc.text(String(q.status || 'draft').toUpperCase(), tX, y + 12);

  if (q.notes) {
    y += 34;
    if (y > 720) { doc.addPage(); y = M; }
    doc.setFont('helvetica', 'normal').setFontSize(8).setTextColor(100, 116, 139);
    doc.text(doc.splitTextToSize('Notes: ' + q.notes, W - M * 2), M, y);
  }

  // Attached photos, two per row with captions.
  // Row-based so a page reset and a row advance can never compound
  // (a per-item index would re-apply the row offset after a break).
  if (images.length) {
    y += 34;
    if (y > 640) { doc.addPage(); y = M; }
    doc.setFont('helvetica', 'bold').setFontSize(9).setTextColor(10, 25, 41);
    doc.text(`Attached photos (${images.length})`, M, y);
    y += 14;
    const boxW = (W - M * 2 - 12) / 2;
    const boxH = Math.min(120, boxW * 0.75);
    for (let i = 0; i < images.length; i += 2) {
      if (y + boxH > 780) { doc.addPage(); y = M; }
      for (let c = 0; c < 2 && i + c < images.length; c++) {
        const idx = i + c;
        const cx = M + c * (boxW + 12);
        let drawn = false;
        try {
          const data = await loadImageAsDataUrl(images[idx]);
          if (data) { doc.addImage(data, 'JPEG', cx, y, boxW, boxH); drawn = true; }
        } catch (_) { /* fall through to placeholder */ }
        if (!drawn) {
          doc.setDrawColor(226, 232, 240).setLineWidth(0.5).rect(cx, y, boxW, boxH);
          doc.setFontSize(7).setTextColor(148, 163, 184);
          doc.text('Image unavailable', cx + boxW / 2, y + boxH / 2, { align: 'center' });
        }
        doc.setFontSize(7).setTextColor(148, 163, 184);
        doc.text('Photo ' + (idx + 1), cx + 2, y + boxH + 10);
      }
      y += boxH + 22;
    }
  }

  doc.save(`${(q.quote_number || 'quote').replace(/[^\w.-]/g, '_')}.pdf`);
  if (btn) { btn.disabled = false; btn.textContent = '⬇️ Download PDF'; }
  toast('Quote downloaded');
};

  doc.save(`${(inv.invoice_number || 'invoice').replace(/[^\w.-]/g, '_')}.pdf`);
  if (btn) { btn.disabled = false; btn.textContent = '⬇️ Download PDF'; }
  toast('Invoice downloaded');

function trunc(doc, text, maxW) {
  let t = String(text || '');
  while (t.length > 1 && doc.getTextWidth(t) > maxW) t = t.slice(0, -1);
  return t === String(text || '') ? t : t + '…';
}

// Storage objects do not send CORS headers for canvas reads, so the logo is
// best-effort: fall back to a text-only header if the fetch or draw fails.
function loadImageAsDataUrl(url) {
  return new Promise((resolve) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    const done = v => resolve(v);
    img.onload = () => {
      try {
        const c = document.createElement('canvas');
        c.width = img.width; c.height = img.height;
        c.getContext('2d').drawImage(img, 0, 0);
        done(c.toDataURL('image/png'));
      } catch (_) { done(null); }
    };
    img.onerror = () => done(null);
    setTimeout(() => done(null), 6000);
    img.src = url;
  });
}

async function loadMessages(el) {
  try {
    const [messages, names, jobs] = await Promise.all([fetchMessages(), fetchNameMap(), fetchJobNameMap()]);
    if (!messages.length) { el.innerHTML = rlsHint('messages'); return; }

    // Group by job so each conversation reads top-to-bottom
    const groups = {};
    messages.forEach(m => { (groups[m.job_id] = groups[m.job_id] || []).push(m); });

    el.innerHTML = `
      <div class="toolbar">
        <input id="msg-search" placeholder="Search message text, sender or job ref…">
        <select id="msg-job"><option value="">All jobs</option>
          ${Object.keys(groups).map(id => `<option value="${id}">${esc(jobs[id] || id.slice(0, 8))}</option>`).join('')}
        </select>
        <span class="count-note">${messages.length} messages · ${Object.keys(groups).length} conversations</span>
      </div>
      <div id="msg-results">
        ${Object.entries(groups).map(([jobId, msgs]) => {
          msgs.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
          const ref = jobs[jobId] || jobId.slice(0, 8);
          const senders = [...new Set(msgs.map(m => names[m.sender_id] || 'Unknown'))];
          return `<div class="chat-thread" data-job="${esc(jobId)}">
            <div class="chat-head">
              <div>
                <div class="who">${esc(ref)}</div>
                <div class="sub">${esc(senders.join(' ↔ '))} · ${msgs.length} message${msgs.length === 1 ? '' : 's'}</div>
              </div>
            </div>
            ${msgs.map(m => `
              <div class="chat-msg ${m.sender_id === state.session.user.id ? 'mine' : ''}">
                <div>
                  <div class="chat-bubble">${esc(m.content)}</div>
                  <div class="chat-meta">
                    <span>${esc(names[m.sender_id] || 'Unknown')}</span>
                    <span>${fmtDateTime(m.created_at)}</span>
                    <span>${m.read_at ? 'read' : 'unread'}</span>
                  </div>
                </div>
              </div>`).join('')}
          </div>`;
        }).join('')}
      </div>`;

    const wire = () => {
      const q = document.getElementById('msg-search').value.toLowerCase();
      const jf = document.getElementById('msg-job').value;
      document.querySelectorAll('.chat-thread').forEach(t => {
        const okJob = !jf || t.dataset.job === jf;
        const okText = !q || t.textContent.toLowerCase().includes(q);
        t.style.display = okJob && okText ? '' : 'none';
      });
    };
    document.getElementById('msg-search').addEventListener('input', wire);
    document.getElementById('msg-job').addEventListener('change', wire);
  } catch (e) {
    el.innerHTML = `<div class="empty">Error: ${esc(e.message)}</div>`;
  }
}

// ── Calls ──

  try {
    const [calls, names, jobs] = await Promise.all([fetchCalls(), fetchNameMap(), fetchJobNameMap()]);
    if (!calls.length) { el.innerHTML = rlsHint('calls'); return; }
    const totalSecs = calls.reduce((s, c) => s + callDuration(c), 0);
    el.innerHTML = `
      <div class="card" style="margin-bottom:20px">
        <h2>Call Summary</h2>
        <div class="stats-grid">
          <div class="stat-card"><div class="stat-value" style="color:#0a1929">${calls.length}</div><div class="stat-label">Total Calls</div></div>
          <div class="stat-card"><div class="stat-value" style="color:#2e7d32">${calls.filter(c => c.status === 'ended').length}</div><div class="stat-label">Connected</div></div>
          <div class="stat-card"><div class="stat-value" style="color:#dc2626">${calls.filter(c => c.status === 'missed').length}</div><div class="stat-label">Missed</div></div>
          <div class="stat-card"><div class="stat-value" style="color:#e65100">${fmtDuration(totalSecs)}</div><div class="stat-label">Talk Time</div></div>
        </div>
      </div>
      <div class="card"><div class="table-wrap"><table>
        <thead><tr><th>Job</th><th>Caller</th><th>Callee</th><th>Status</th><th>Duration</th><th>Channel</th><th>Started</th></tr></thead>
        <tbody>${calls.map(c => `<tr>
          <td><strong>${esc(jobs[c.job_id] || '—')}</strong></td>
          <td>${esc(c.caller_name || names[c.caller_id] || '—')}</td>
          <td>${esc(names[c.callee_id] || '—')}</td>
          <td><span class="badge ${c.status === 'ended' ? 'badge-green' : c.status === 'ongoing' ? 'badge-blue' : c.status === 'missed' ? 'badge-red' : 'badge-gray'}">${esc(c.status)}</span></td>

// ── Media (all uploaded images) ──
async function loadMedia(el) {
  try {
    const [jobs, quotes, businesses] = await Promise.all([
      _supabase.from('jobs').select('id, reference_number, description, images').limit(200),
      _supabase.from('quotes').select('id, quote_number, title, images').limit(200),
      _supabase.from('business_profiles').select('id, business_name, logo_url, gallery_urls, certificate_urls').limit(200),
    ]);

    const j = jobs.data || [], q = quotes.data || [], b = businesses.data || [];
    const jobPhotos = [], quotePhotos = [], bizMedia = [];

    j.forEach(job => (job.images || []).forEach(u => jobPhotos.push({ url: u, ref: job.reference_number, desc: job.description })));
    q.forEach(quote => (quote.images || []).forEach(u => quotePhotos.push({ url: u, ref: quote.quote_number, desc: quote.title })));
    b.forEach(biz => {
      if (biz.logo_url) bizMedia.push({ url: biz.logo_url, ref: biz.business_name, desc: 'Logo' });
      (biz.gallery_urls || []).forEach(u => bizMedia.push({ url: u, ref: biz.business_name, desc: 'Gallery' }));
      (biz.certificate_urls || []).forEach(u => bizMedia.push({ url: u, ref: biz.business_name, desc: 'Certificate' }));
    });

    const total = jobPhotos.length + quotePhotos.length + bizMedia.length;
    if (!total) { el.innerHTML = '<div class="empty">No images uploaded yet</div>'; return; }

    const section = (title, items) => items.length ? `
      <div class="media-section">
        <h2>${title} (${items.length})</h2>
        <div class="media-grid">
          ${items.map(it => `<div class="media-item" onclick="openLightbox('${jsq(it.url)}', '${jsq((it.ref || '') + ' — ' + (it.desc || ''))}')">
            <div class="thumb" style="background-image:url('${esc(it.url)}')" onerror="this.style.backgroundImage='none';this.textContent='🖼️'"></div>
            <div class="cap">
              <div class="t" title="${esc(it.ref || '')}">${esc(it.ref || '—')}</div>
              <div class="s">${esc((it.desc || '').substring(0, 40))}</div>
            </div>
          </div>`).join('')}
        </div>
      </div>` : '';

    el.innerHTML = `
      <div class="card" style="margin-bottom:20px"><h2>Media Library (${total})</h2>
        <p style="font-size:13px;color:#64748b">All job photos, quote photos and business media. Click any image to view full size.</p>
      </div>
      ${section('Job Photos', jobPhotos)}
      ${section('Quote Photos', quotePhotos)}
      ${section('Business Logos, Galleries &amp; Certificates', bizMedia)}`;
  } catch (e) {
    el.innerHTML = `<div class="empty">Error: ${esc(e.message)}</div>`;
  }
}

window.openLightbox = function(url, caption) {
  const box = document.createElement('div');
  box.className = 'lightbox';
  box.onclick = () => box.remove();
  box.innerHTML = `<img src="${esc(url)}" alt=""><div class="lb-cap">${esc(caption || '')}</div>`;
  document.body.appendChild(box);
};

  try {
    const cats = await fetchCategories();
    el.innerHTML = `
      <div class="add-category">
        <h2>➕ Add New Category</h2>
        <div class="form-row">

window.addCategory = async function() {
  const name = document.getElementById('cat-name').value.trim();
  const display = document.getElementById('cat-display').value.trim();
  const desc = document.getElementById('cat-desc').value.trim();
  if (!name || !display) { toast('Slug and display name are required'); return; }
  await _supabase.from('service_categories').insert({ name, display_name: display, description: desc });
  document.getElementById('cat-name').value = '';
  document.getElementById('cat-display').value = '';
  document.getElementById('cat-desc').value = '';
  toast('Category added');
  render();
};

window.deleteCategory = async function(id, name) {
  if (!confirm(`Delete "${name}"?`)) return;
  await _supabase.from('service_categories').delete().eq('id', id);
  toast('Category deleted');
  render();
};

// ── Helpers ──
function publicUrl(path) {
  return `${SUPABASE_URL}/storage/v1/object/public/business-media/${path}`;
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// Escape a value for use inside a single-quoted inline JS string (onclick="...").
// esc() does not escape quotes, so captions/URLs must go through this.
function jsq(s) {
  return String(s == null ? '' : s)
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'")
    .replace(/"/g, '&quot;')
    .replace(/\r?\n/g, ' ');
}

function fmtDate(iso) {
  if (!iso) return '—';
  try { return new Date(iso).toLocaleDateString('en-ZA', { day: '2-digit', month: 'short', year: 'numeric' }); }
  catch(_) { return iso; }
}

function fmtDateTime(iso) {
  if (!iso) return '—';
  try { return new Date(iso).toLocaleString('en-ZA', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); }
  catch(_) { return iso; }
}

function callDuration(c) {
  if (!c.started_at || !c.ended_at) return 0;
  const s = (new Date(c.ended_at) - new Date(c.started_at)) / 1000;
  return s > 0 ? s : 0;
}

function fmtDuration(secs) {
  secs = Math.round(secs || 0);
  if (secs < 60) return `${secs}s`;
  const m = Math.floor(secs / 60);
  if (m < 60) return `${m}m ${secs % 60}s`;
  return `${Math.floor(m / 60)}h ${m % 60}m`;
}

function statusBadge(s) {
  const map = {
    pending: 'badge-orange', accepted: 'badge-blue', on_the_way: 'badge-blue',
    arrived: 'badge-teal', in_progress: 'badge-purple', completed: 'badge-green',
    cancelled: 'badge-red', draft: 'badge-gray', sent: 'badge-blue',
    paid: 'badge-green', issued: 'badge-blue', pending_payment: 'badge-orange',
    rejected: 'badge-red', converted_to_job: 'badge-purple',
    missed: 'badge-red', ended: 'badge-green', ongoing: 'badge-blue',
  };
  return map[s] || 'badge-gray';
}

// ── Init ──
(async () => {
  try {
    const { data: { session } } = await _supabase.auth.getSession();
    state.session = session;
    if (state.session) {
      let role = state.session.user?.user_metadata?.role;
      if (role !== 'admin') {
        const { data: profile } = await _supabase.from('profiles').select('role').eq('id', state.session.user.id).maybeSingle();
        role = profile?.role;
      }
      if (role !== 'admin') { await _supabase.auth.signOut(); state.session = null; }
    }
    state.route = window.location.hash.slice(1) || (state.session ? 'dashboard' : 'login');
    render();
  } catch (e) {
    document.getElementById('app').innerHTML = `
      <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:inherit;background:#f0f4f8">
        <div style="background:#fff;padding:40px;border-radius:16px;max-width:500px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.06)">
          <div style="font-size:48px;margin-bottom:16px">⚠️</div>
          <h2 style="color:#dc2626;margin-bottom:12px;font-size:20px">Failed to load</h2>
          <p style="color:#64748b;font-size:14px;margin-bottom:8px">${e.message || e}</p>
          <p style="color:#94a3b8;font-size:12px">Check browser console (F12) for details.</p>
        </div>
      </div>`;
  }
})();
